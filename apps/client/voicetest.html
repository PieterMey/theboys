<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <title>DEAD AIR · voice test</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23030405%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%274%27 fill=%27%237fd17f%27/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #07090b; color: #c9d1d9; font: 14px/1.4 ui-monospace, Consolas, Menlo, monospace; }
      #app { max-width: 560px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 18px; letter-spacing: 0.25em; margin: 8px 0 2px; color: #e6edf3; }
      .sub { font-size: 11px; letter-spacing: 0.12em; opacity: 0.6; margin: 0 0 16px; }
      .card { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 12px; margin: 10px 0; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      input[type=text] { flex: 1; min-width: 120px; background: #010409; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 10px; font: inherit; font-size: 18px; letter-spacing: 0.3em; text-transform: uppercase; }
      button { background: #238636; color: #fff; border: 0; border-radius: 4px; padding: 11px 16px; font: inherit; font-weight: 700; letter-spacing: 0.1em; }
      button.secondary { background: #30363d; }
      button:disabled { opacity: 0.5; }
      .peer { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-top: 1px solid #21262d; }
      .peer:first-child { border-top: 0; }
      .badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.08em; }
      .direct { background: #1f6f3f; color: #d2f4dc; }
      .relay { background: #6e5a12; color: #fff3c4; }
      .failed { background: #7d1d1d; color: #ffd7d5; }
      .pending { background: #30363d; color: #c9d1d9; }
      .bar { height: 8px; background: #161b22; border-radius: 2px; overflow: hidden; grid-column: 1 / -1; }
      .bar > div { height: 100%; background: #7fd17f; transition: width 80ms linear; }
      .muted { opacity: 0.6; font-size: 12px; }
      label { display: flex; gap: 6px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/voice/voicetest/main.tsx"></script>
  </body>
</html>
